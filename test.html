<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple JS Form</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        #message { color: green; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Simple JavaScript Form</h2>

    <!-- 1. The HTML Form Structure -->
    <form id="myForm">
        <div class="form-group">
            <label for="username">Name:</label>
            <input type="text" id="username" required>
        </div>
        <button type="submit">Submit Form</button>
    </form>

    <!-- UI element to display success message -->
    <p id="message"></p>

    <!-- 2. The JavaScript Implementation -->
    <script>
        // Select the form element from the DOM
        const form = document.getElementById('myForm');
        const messageDisplay = document.getElementById('message');

        // Listen for the "submit" event on the form
        form.addEventListener('submit', function(event) {
            // Stop the browser from reloading the page
            event.preventDefault();

            // Extract the value from the input field
            const nameValue = document.getElementById('username').value;

            // Process the data (Displaying it dynamically on the screen)
            messageDisplay.textContent = `Hello, ${nameValue}! Form submitted successfully.`;

            // Optional: Reset the input field after submission
            form.reset();
        });
    </script>

</body>
</html>
